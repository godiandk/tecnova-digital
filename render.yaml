# Publicação do Casino Inova no Render, num serviço só.
#
# Este arquivo mora na RAIZ do repositório de propósito: o Render só procura
# render.yaml aqui. Dentro de casino-inova/ ele simplesmente não seria encontrado, e o
# Blueprint diria que não há nada pra criar.
#
# O que ele monta sozinho: o banco Postgres, o serviço web a partir do Dockerfile, e a
# ligação entre os dois. Nenhuma senha fica escrita aqui — DATABASE_URL vem do banco e
# os segredos são sorteados pelo próprio Render.
services:
  - type: web
    name: casino-inova
    runtime: docker
    # Escrito em relação à raiz do repositório, que é onde este arquivo está.
    dockerfilePath: ./casino-inova/Dockerfile
    dockerContext: ./casino-inova
    # `free` explícito: sem esta linha o Render usa o plano pago por padrão.
    plan: free
    # Rota pública e barata, que responde sem login e sem tocar no banco.
    healthCheckPath: /games/slots/config
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: casino-inova-db
          property: connectionString
      # Sorteado na hospedagem. O servidor se recusa a subir sem ele, de propósito.
      - key: JWT_SECRET
        generateValue: true
      # Usado pra conferir a assinatura do aviso de compra da RevenueCat. O mesmo valor
      # tem que ser colado lá no painel dela — copie do painel do Render depois.
      - key: PURCHASE_WEBHOOK_SECRET
        generateValue: true

databases:
  - name: casino-inova-db
    databaseName: casino_inova
    plan: free
